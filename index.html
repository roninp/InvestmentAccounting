<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ребалансировка портфеля</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .font-mono { font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useCallback, useMemo, useEffect } = React;

    // ============================================================================
    // DOMAIN LAYER - Бизнес-логика
    // ============================================================================

    class PortfolioCalculator {
      static calculateTotalValue(assets) {
        return assets.reduce((sum, asset) => sum + (asset.quantity * asset.price), 0);
      }

      static calculatePercentages(assets) {
        const total = this.calculateTotalValue(assets);
        if (total === 0) return assets.map(() => 0);
        return assets.map(asset => (asset.quantity * asset.price) / total * 100);
      }

      static calculateRequiredQuantity(asset, targetPercent, totalValue) {
        if (totalValue === 0) return 0;
        return (targetPercent / 100) * totalValue / asset.price;
      }

      static calculateAdjustment(currentQuantity, requiredQuantity) {
        return requiredQuantity - currentQuantity;
      }

      static analyzePortfolio(assets) {
        const totalValue = this.calculateTotalValue(assets);
        const currentPercentages = this.calculatePercentages(assets);

        return assets.map((asset, index) => {
          const currentPercent = currentPercentages[index];
          const requiredQuantity = this.calculateRequiredQuantity(asset, asset.targetPercent, totalValue);
          const adjustment = this.calculateAdjustment(asset.quantity, requiredQuantity);

          return {
            ...asset,
            currentValue: asset.quantity * asset.price,
            currentPercent,
            requiredQuantity,
            adjustment,
            adjustmentValue: adjustment * asset.price,
            isOverweight: currentPercent > asset.targetPercent,
            isUnderweight: currentPercent < asset.targetPercent,
          };
        });
      }
    }

    /**
     * Сервис получения цен через ISS API Московской биржи.
     *
     * Автоматически определяет рынок (акции, ETF, облигации и т.д.)
     * и режим торгов (доску) для каждого актива, извлекает цену последней
     * сделки (LAST).
     *
     * ISS API: https://iss.moex.com/iss/
     * Поддерживает CORS, не требует авторизации.
     */
    class MoexPriceService {
      /** Базовый URL ISS API */
      static ISS_URL = 'https://iss.moex.com/iss';

      /**
       * Рынки для поиска актива в порядке приоритета.
       * Каждый рынок проверяется последовательно, пока не найдётся цена.
       */
      static MARKETS = [
        { engine: 'stock', market: 'shares' },        // Акции
        { engine: 'stock', market: 'etf' },            // ETF / ПИФы
        { engine: 'stock', market: 'bonds' },          // Облигации
        { engine: 'stock', market: 'foreignshares' },  // Иностранные акции
        { engine: 'stock', market: 'depositaryreceipts' }, // Депозитарные расписки
      ];

      /**
       * Приоритет досок для выбора цены внутри одного рынка.
       * TQBR — основной режим акций
       * TQTF — ETF / ПИФы
       * TQOB — облигации
       * TQTD — депозитарные расписки
       * TQPI — паи
       * SMAL — малые предприятия (SME)
       */
      static BOARD_PRIORITY = ['TQBR', 'TQTF', 'TQOB', 'TQTD', 'TQPI', 'SMAL', 'CETS'];

      /**
       * Получить текущую цену актива по тикеру.
       *
       * Алгоритм:
       * 1. Перебирает рынки (акции → ETF → облигации → ...)
       * 2. Для каждого рынка запрашивает marketdata и securities через ISS API
       * 3. Ищет доску с ценой LAST в порядке приоритета BOARD_PRIORITY
       * 4. Если LAST недоступен — использует MARKETPRICE (рыночная цена)
       * 5. Если MARKETPRICE недоступен — использует LCLOSEPRICE (цена закрытия предыдущей сессии)
       * 6. Если LCLOSEPRICE недоступен — использует PREVPRICE из securities (предыдущая цена закрытия)
       * 7. Если ни одна приоритетная доска не найдена — берёт первую строку с ценой
       *
       * @param {string} ticker - Тикер актива (например 'SBER')
       * @returns {Promise<number>} Цена актива
       * @throws {Error} Если цена не найдена ни на одном рынке
       */
      static async fetchPrice(ticker) {
        const tickerUpper = ticker.toUpperCase();
        let lastError = null;

        // Перебираем рынки в порядке приоритета
        for (const { engine, market } of this.MARKETS) {
          try {
            const url = `${this.ISS_URL}/engines/${engine}/markets/${market}/securities/${tickerUpper}.json?iss.meta=off`;

            const response = await fetch(url, {
              signal: AbortSignal.timeout(5000),
            });

            // 404 = актив не найден на этом рынке, пробуем следующий
            if (response.status === 404) continue;
            if (!response.ok) {
              lastError = new Error(`HTTP ${response.status}`);
              continue;
            }

            const data = await response.json();
            const marketdata = data.marketdata;
            const securities = data.securities;

            if (!marketdata?.data?.length) continue;

            const columns = marketdata.columns;
            const boardIdx = columns.indexOf('BOARDID');
            const lastIdx = columns.indexOf('LAST');
            const marketPriceIdx = columns.indexOf('MARKETPRICE');
            const lclosePriceIdx = columns.indexOf('LCLOSEPRICE');

            if (boardIdx === -1 || lastIdx === -1) continue;

            // 1. Ищем подходящую доску по приоритету
            for (const board of this.BOARD_PRIORITY) {
              const row = marketdata.data.find(r => r[boardIdx] === board);
              if (!row) continue;

              // 1a. LAST — цена последней сделки
              if (row[lastIdx] && parseFloat(row[lastIdx]) > 0) {
                return parseFloat(row[lastIdx]);
              }

              // 1b. MARKETPRICE — рыночная цена (доступна даже в нерабочие дни)
              if (marketPriceIdx !== -1 && row[marketPriceIdx] && parseFloat(row[marketPriceIdx]) > 0) {
                return parseFloat(row[marketPriceIdx]);
              }

              // 1c. LCLOSEPRICE — цена закрытия предыдущей сессии
              if (lclosePriceIdx !== -1 && row[lclosePriceIdx] && parseFloat(row[lclosePriceIdx]) > 0) {
                return parseFloat(row[lclosePriceIdx]);
              }
            }

            // 2. Если не нашли по приоритету — берём первую строку с ценой
            for (const row of marketdata.data) {
              // 2a. LAST
              if (row[lastIdx] && parseFloat(row[lastIdx]) > 0) {
                return parseFloat(row[lastIdx]);
              }

              // 2b. MARKETPRICE
              if (marketPriceIdx !== -1 && row[marketPriceIdx] && parseFloat(row[marketPriceIdx]) > 0) {
                return parseFloat(row[marketPriceIdx]);
              }

              // 2c. LCLOSEPRICE
              if (lclosePriceIdx !== -1 && row[lclosePriceIdx] && parseFloat(row[lclosePriceIdx]) > 0) {
                return parseFloat(row[lclosePriceIdx]);
              }
            }

            // 3. Если marketdata не дал цены — пробуем PREVPRICE из securities
            if (securities?.data?.length) {
              const secColumns = securities.columns;
              const prevPriceIdx = secColumns.indexOf('PREVPRICE');
              if (prevPriceIdx !== -1) {
                for (const row of securities.data) {
                  if (row[prevPriceIdx] && parseFloat(row[prevPriceIdx]) > 0) {
                    return parseFloat(row[prevPriceIdx]);
                  }
                }
              }
            }
          } catch (err) {
            // Таймаут или сетевую ошибку сохраняем, но продолжаем
            // пробовать другие рынки
            lastError = err;
          }
        }

        // Если ни один рынок не дал результата
        throw lastError || new Error(`Актив "${tickerUpper}" не найден на Мосбирже`);
      }

      /**
       * Получить цены для нескольких активов.
       * Каждый актив загружается независимо — если один упал,
       * остальные всё равно загрузятся.
       *
       * @param {string[]} tickers - Массив тикеров
       * @returns {Promise<{prices: (number|null)[], errors: string[]}>}
       */
      static async fetchPrices(tickers) {
        const results = await Promise.allSettled(
          tickers.map(t => this.fetchPrice(t))
        );

        const prices = results.map(r =>
          r.status === 'fulfilled' ? r.value : null
        );

        const errors = tickers
          .map((t, i) =>
            results[i].status === 'rejected'
              ? `${t}: ${results[i].reason.message}`
              : null
          )
          .filter(Boolean);

        return { prices, errors };
      }
    }

    class AssetValidator {
      static validate(asset) {
        const errors = [];
        if (!asset.ticker || asset.ticker.trim() === '') {
          errors.push('Тикер не может быть пустым');
        }
        if (asset.quantity < 0) {
          errors.push('Количество не может быть отрицательным');
        }
        if (asset.price <= 0) {
          errors.push('Цена должна быть положительной');
        }
        if (asset.targetPercent < 0 || asset.targetPercent > 100) {
          errors.push('Целевой процент должен быть от 0 до 100');
        }
        return { isValid: errors.length === 0, errors };
      }

      static validatePortfolio(assets) {
        const totalPercent = assets.reduce((sum, a) => sum + a.targetPercent, 0);
        if (Math.abs(totalPercent - 100) > 0.01) {
          return {
            isValid: false,
            error: `Сумма целевых процентов должна быть 100%, сейчас ${totalPercent.toFixed(2)}%`,
          };
        }
        return { isValid: true };
      }
    }

    // ============================================================================
    // UI LAYER - React компоненты
    // ============================================================================

    function AssetRow({ asset, analysis, onUpdate, onRemove, isLoading }) {
      const handleQuantityChange = (e) => {
        onUpdate({ ...asset, quantity: parseInt(e.target.value, 10) || 0 });
      };
      const handlePriceChange = (e) => {
        onUpdate({ ...asset, price: parseFloat(e.target.value) || 0 });
      };
      const handleTargetPercentChange = (e) => {
        onUpdate({ ...asset, targetPercent: parseFloat(e.target.value) || 0 });
      };

      const getAdjustmentColor = (adjustment) => {
        if (adjustment > 0.1) return 'text-green-600 bg-green-50';
        if (adjustment < -0.1) return 'text-red-600 bg-red-50';
        return 'text-gray-600';
      };

      const getPercentageColor = (current, target) => {
        if (Math.abs(current - target) < 1) return 'bg-emerald-100 text-emerald-900';
        if (current > target) return 'bg-amber-100 text-amber-900';
        return 'bg-blue-100 text-blue-900';
      };

      if (!analysis) return null;

      return (
        <tr className="border-b border-slate-200 hover:bg-slate-50 transition-colors">
          <td className="px-2 sm:px-4 py-3 font-medium text-slate-900">
            <input
              type="text"
              value={asset.ticker}
              onChange={(e) => onUpdate({ ...asset, ticker: e.target.value.toUpperCase() })}
              className="w-24 px-2 py-1 border border-slate-300 rounded font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              maxLength="6"
            />
          </td>
          <td className="px-2 sm:px-4 py-3">
            <input
              type="number"
              value={asset.quantity}
              onChange={handleQuantityChange}
              className="w-20 px-2 py-1 border border-slate-300 rounded text-sm text-right focus:outline-none focus:ring-2 focus:ring-blue-500"
              step="1"
            />
          </td>
          <td className="px-2 sm:px-4 py-3 text-right font-mono">
            <input
              type="number"
              value={asset.price}
              onChange={handlePriceChange}
              disabled={isLoading}
              className="w-24 ml-auto px-2 py-1 border border-slate-300 rounded text-sm text-right focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-slate-100"
              step="0.01"
            />
          </td>
          <td className="px-2 sm:px-4 py-3 text-right font-mono text-slate-900 font-medium">
            {analysis.currentValue.toFixed(2)} ₽
          </td>
          <td className="px-2 sm:px-4 py-3">
            <input
              type="number"
              value={asset.targetPercent}
              onChange={handleTargetPercentChange}
              className="w-20 px-2 py-1 border border-slate-300 rounded text-sm text-right focus:outline-none focus:ring-2 focus:ring-blue-500"
              min="0" max="100" step="0.1"
            />
          </td>
          <td className="px-2 sm:px-4 py-3 text-center">
            <span className={`inline-block px-3 py-1 rounded-full text-sm font-medium ${getPercentageColor(analysis.currentPercent, asset.targetPercent)}`}>
              {analysis.currentPercent.toFixed(1)}%
            </span>
          </td>
          <td className="px-2 sm:px-4 py-3 text-right font-mono text-sm">
            <div className="text-slate-600">{Math.round(analysis.requiredQuantity)}</div>
          </td>
          <td className={`px-2 sm:px-4 py-3 text-right font-mono font-medium ${getAdjustmentColor(analysis.adjustment)}`}>
            <div>{analysis.adjustment > 0 ? '+' : ''}{Math.round(analysis.adjustment)}</div>
            <div className="text-xs mt-1">{analysis.adjustmentValue > 0 ? '+' : ''}{analysis.adjustmentValue.toFixed(2)} ₽</div>
          </td>
          <td className="px-2 sm:px-4 py-3 text-center">
            <button
              onClick={() => onRemove(asset.id)}
              disabled={asset.id <= 2}
              className="p-1 text-slate-500 hover:text-red-600 disabled:opacity-30 disabled:cursor-not-allowed transition-colors"
              title="Минимум 2 актива"
            >
              🗑️
            </button>
          </td>
        </tr>
      );
    }

    function PortfolioHeader() {
      return (
        <thead className="bg-gradient-to-r from-slate-900 to-slate-800 text-white">
          <tr>
            <th className="px-2 sm:px-4 py-3 text-left text-sm font-semibold">Актив</th>
            <th className="px-2 sm:px-4 py-3 text-left text-sm font-semibold">Кол-во</th>
            <th className="px-2 sm:px-4 py-3 text-right text-sm font-semibold">Цена</th>
            <th className="px-2 sm:px-4 py-3 text-right text-sm font-semibold">Сумма</th>
            <th className="px-2 sm:px-4 py-3 text-left text-sm font-semibold">Цель %</th>
            <th className="px-2 sm:px-4 py-3 text-center text-sm font-semibold">Текущий %</th>
            <th className="px-2 sm:px-4 py-3 text-right text-sm font-semibold">Требуется</th>
            <th className="px-2 sm:px-4 py-3 text-right text-sm font-semibold">Купить/Продать</th>
            <th className="px-2 sm:px-4 py-3 text-center text-sm font-semibold">Удалить</th>
          </tr>
        </thead>
      );
    }

    function PortfolioSummary({ analysis }) {
      const totalValue = PortfolioCalculator.calculateTotalValue(analysis);
      const totalAdjustmentValue = analysis.reduce((sum, a) => sum + Math.abs(a.adjustmentValue), 0);

      return (
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
          <div className="bg-gradient-to-br from-blue-50 to-blue-100 rounded-lg p-4 border border-blue-200">
            <div className="text-sm text-blue-600 font-medium mb-1">Стоимость портфеля</div>
            <div className="text-2xl font-bold text-blue-900">{totalValue.toFixed(2)} ₽</div>
          </div>
          <div className="bg-gradient-to-br from-purple-50 to-purple-100 rounded-lg p-4 border border-purple-200">
            <div className="text-sm text-purple-600 font-medium mb-1">Требуется ребалансировки</div>
            <div className="text-2xl font-bold text-purple-900">{totalAdjustmentValue.toFixed(2)} ₽</div>
          </div>
          <div className="bg-gradient-to-br from-emerald-50 to-emerald-100 rounded-lg p-4 border border-emerald-200">
            <div className="text-sm text-emerald-600 font-medium mb-1">В целевых пропорциях</div>
            <div className="text-2xl font-bold text-emerald-900">
              {analysis.filter(a => Math.abs(a.currentPercent - a.targetPercent) < 1).length}/{analysis.length}
            </div>
          </div>
        </div>
      );
    }

    function PortfolioRebalancer() {
      const [assets, setAssets] = useState([
        { id: 1, ticker: 'SBER', quantity: 10, price: 0, targetPercent: 50 },
        { id: 2, ticker: 'GAZP', quantity: 20, price: 0, targetPercent: 50 },
      ]);

      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [nextId, setNextId] = useState(3);

      const analysis = useMemo(() => PortfolioCalculator.analyzePortfolio(assets), [assets]);
      const portfolioValidation = useMemo(() => AssetValidator.validatePortfolio(assets), [assets]);

      const handleUpdateAsset = useCallback((updatedAsset) => {
        const validation = AssetValidator.validate(updatedAsset);
        if (!validation.isValid) {
          setError(validation.errors[0]);
          return;
        }
        setAssets(prevAssets => prevAssets.map(a => a.id === updatedAsset.id ? updatedAsset : a));
        setError(null);
      }, []);

      const handleAddAsset = useCallback(() => {
        setAssets(prevAssets => [...prevAssets, { id: nextId, ticker: '', quantity: 0, price: 0, targetPercent: 0 }]);
        setNextId(prev => prev + 1);
        setError(null);
      }, [nextId]);

      const handleRemoveAsset = useCallback((id) => {
        if (assets.length <= 2) return;
        setAssets(prevAssets => prevAssets.filter(a => a.id !== id));
      }, [assets.length]);

      /**
       * Загрузка цен через ISS API Мосбиржи.
       * Каждый актив загружается независимо — частичные ошибки не блокируют остальные.
       */
      const handleRefreshPrices = useCallback(async () => {
        setLoading(true);
        setError(null);
        try {
          const tickers = assets.map(a => a.ticker).filter(t => t);
          if (tickers.length === 0) {
            setLoading(false);
            return;
          }

          const { prices, errors } = await MoexPriceService.fetchPrices(tickers);

          // Обновляем цены — null оставляем старую цену
          setAssets(prevAssets =>
            prevAssets.map((asset, index) => ({
              ...asset,
              price: prices[index] !== null ? prices[index] : asset.price,
            }))
          );

          // Показываем ошибки, если были
          if (errors.length > 0) {
            setError(`Не удалось загрузить: ${errors.join('; ')}`);
          }
        } catch (err) {
          setError(`Ошибка получения цен: ${err.message}`);
        } finally {
          setLoading(false);
        }
      }, [assets]);

      /**
       * Автоматическая загрузка цен при первом рендере.
       * Срабатывает только один раз при монтировании компонента.
       */
      useEffect(() => {
        handleRefreshPrices();
      }, []);

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 via-slate-100 to-slate-50">
          <div className="bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 text-white shadow-lg">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
              <div className="flex items-center gap-3 mb-2">
                <span className="text-3xl">📈</span>
                <h1 className="text-2xl sm:text-3xl font-bold">Ребалансировка портфеля</h1>
              </div>
              <p className="text-slate-400 text-sm sm:text-base">Управление активами Мосбиржи с автоматическим расчетом ребалансировки</p>
            </div>
          </div>

          <div className="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
            <PortfolioSummary analysis={analysis} />

            {error && (
              <div className="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg text-red-800 text-sm">
                ⚠️ {error}
              </div>
            )}

            <div className="bg-white rounded-lg shadow-md border border-slate-200 overflow-x-auto">
              <table className="w-full min-w-[700px]">
                <PortfolioHeader />
                <tbody>
                  {assets.map(asset => (
                    <AssetRow
                      key={asset.id}
                      asset={asset}
                      analysis={analysis.find(a => a.id === asset.id)}
                      onUpdate={handleUpdateAsset}
                      onRemove={handleRemoveAsset}
                      isLoading={loading}
                    />
                  ))}
                </tbody>
              </table>
            </div>

            {!portfolioValidation.isValid && (
              <div className="mt-4 p-4 bg-amber-50 border border-amber-200 rounded-lg text-amber-800 text-sm">
                ⚠️ {portfolioValidation.error}
              </div>
            )}

            <div className="mt-6 flex flex-col sm:flex-row gap-3">
              <button
                onClick={handleRefreshPrices}
                disabled={loading || assets.filter(a => a.ticker).length === 0}
                className="flex items-center justify-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:bg-slate-400 disabled:cursor-not-allowed transition-colors font-medium w-full sm:w-auto"
              >
                🔄 {loading ? 'Загрузка...' : 'Обновить цены'}
              </button>
              <button
                onClick={handleAddAsset}
                disabled={assets.length >= 100}
                className="flex items-center justify-center gap-2 px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 disabled:bg-slate-400 disabled:cursor-not-allowed transition-colors font-medium w-full sm:w-auto"
              >
                ➕ Добавить актив ({assets.length}/100)
              </button>
            </div>

            <div className="mt-8 p-4 bg-slate-100 rounded-lg text-slate-700 text-sm">
              <p className="font-medium mb-2">💡 Как использовать:</p>
              <ul className="list-disc list-inside space-y-1 text-slate-600">
                <li>Введите тикер актива и нажмите "Обновить цены" для загрузки текущих котировок</li>
                <li>Установите целевой процент для каждого актива (сумма должна быть 100%)</li>
                <li>Колонка "Купить/Продать" показывает необходимые действия для ребалансировки</li>
                <li>Зелёный цвет - актив в целевых пропорциях, жёлтый - избыточный, синий - недостаточный</li>
              </ul>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // Mount
    // ============================================================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PortfolioRebalancer />);
  </script>
</body>
</html>
