<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ребалансировка портфеля</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .font-mono { font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeInUp 0.45s ease-out both; }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
      50%      { box-shadow: 0 0 0 8px rgba(59, 130, 246, 0); }
    }
    .animate-pulse-glow { animation: pulse-glow 1s ease-in-out infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin-calc { display: inline-block; animation: spin 0.8s linear infinite; }

    @keyframes highlight-flash {
      0%   { background-color: rgba(16, 185, 129, 0.25); }
      100% { background-color: transparent; }
    }
    .animate-highlight { animation: highlight-flash 0.8s ease-out; }

    .animate-delay-1  { animation-delay: 0.00s; }
    .animate-delay-2  { animation-delay: 0.04s; }
    .animate-delay-3  { animation-delay: 0.08s; }
    .animate-delay-4  { animation-delay: 0.12s; }
    .animate-delay-5  { animation-delay: 0.16s; }
    .animate-delay-6  { animation-delay: 0.20s; }
    .animate-delay-7  { animation-delay: 0.24s; }
    .animate-delay-8  { animation-delay: 0.28s; }
    .animate-delay-9  { animation-delay: 0.32s; }
    .animate-delay-10 { animation-delay: 0.36s; }

    /* Неактивная настройка — приглушённый вид */
    .setting-disabled { opacity: 0.55; }
    .setting-disabled .setting-title { color: #94a3b8; } /* slate-400 */
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useCallback, useMemo, useEffect, useRef } = React;

    // ============================================================================
    // DOMAIN LAYER — Бизнес-логика, независимая от UI
    // ============================================================================

    /**
     * Сервис расчёта портфеля — S из SOLID (Single Responsibility).
     * Отвечает только за математику портфеля, не зависит от React.
     */
    class PortfolioCalculator {
      /**
       * Округление денежной суммы строго вниз до сотых долей.
       * @param {number} value - Исходное значение
       * @returns {number} Округлённое значение (2 знака после запятой)
       */
      static floorMoney(value) {
        return Math.floor(value * 100) / 100;
      }

      /**
       * Округление количества активов строго вниз до целого числа.
       * @param {number} value - Исходное значение
       * @returns {number} Округлённое значение (целое число)
       */
      static floorQuantity(value) {
        return Math.floor(value);
      }

      static calculateTotalValue(assets) {
        return assets.reduce((sum, asset) => sum + (asset.quantity * asset.price), 0);
      }

      /**
       * Расчет процента каждого актива.
       * В режиме групп (groups передан и не пуст) процент считается
       * внутри группы: стоимость актива / стоимость группы * 100.
       * Актив без группы (groupId == null) считается от всего портфеля (fallback).
       * @param {Array} assets - Массив активов
       * @param {Array|null} [groups] - Массив групп [{ id, name, percent }]
       * @returns {number[]} Процент каждого актива
       */
      static calculatePercentages(assets, groups = null) {
        const total = this.calculateTotalValue(assets);
        if (total === 0) return assets.map(() => 0);

        // Режим групп: процент считается внутри группы
        if (groups && groups.length > 0) {
          return assets.map(asset => {
            if (asset.groupId == null) {
              // Актив без группы — процент от всего портфеля (fallback)
              return (asset.quantity * asset.price) / total * 100;
            }
            const groupAssets = assets.filter(a => a.groupId === asset.groupId);
            const groupTotal = this.calculateTotalValue(groupAssets);
            if (groupTotal === 0) return 0;
            return (asset.quantity * asset.price) / groupTotal * 100;
          });
        }

        return assets.map(asset => (asset.quantity * asset.price) / total * 100);
      }

      static calculateRequiredQuantity(asset, targetPercent, totalValue) {
        if (totalValue === 0 || asset.price === 0) return 0;
        const raw = (targetPercent / 100) * totalValue / asset.price;
        return this.floorQuantity(raw);
      }

      static calculateAdjustment(currentQuantity, requiredQuantity) {
        return requiredQuantity - currentQuantity;
      }

      /**
       * Распределение целевых процентов внутри одной группы активов.
       * Актив считается нулевым, если его targetPercent === 0 ИЛИ его id находится
       * в наборе emptyTargetIds (поле "Цель" пустое, фокус ещё не потерян).
       * @param {Array} groupAssets - Активы одной группы
       * @param {Set<number>} emptyTargetIds - Набор id активов с пустым полем "Цель"
       * @returns {Array} Новый массив с заполненными targetPercent
       */
      static distributeGroupTargets(groupAssets, emptyTargetIds) {
        if (groupAssets.length === 0) return groupAssets;

        const isZeroAsset = (a) =>
          a.targetPercent === 0 ||
          a.targetPercent == null ||
          emptyTargetIds.has(a.id);
        const zeroAssets = groupAssets.filter(isZeroAsset);
        const nonzeroAssets = groupAssets.filter(a => !isZeroAsset(a));

        if (zeroAssets.length === groupAssets.length) {
          const equalPercent = 100 / groupAssets.length;
          return groupAssets.map((asset, index) => {
            if (index === groupAssets.length - 1) {
              const allocated = (groupAssets.length - 1) * parseFloat(equalPercent.toFixed(2));
              return { ...asset, targetPercent: parseFloat((100 - allocated).toFixed(2)) };
            }
            return { ...asset, targetPercent: parseFloat(equalPercent.toFixed(2)) };
          });
        }

        if (zeroAssets.length > 0 && nonzeroAssets.length > 0) {
          const sumNonZero = nonzeroAssets.reduce((sum, a) => sum + a.targetPercent, 0);
          const remaining = 100 - sumNonZero;
          if (remaining <= 0) {
            const eq = 100 / groupAssets.length;
            return groupAssets.map((a, i) => {
              if (i === groupAssets.length - 1) {
                const al = (groupAssets.length - 1) * parseFloat(eq.toFixed(2));
                return { ...a, targetPercent: parseFloat((100 - al).toFixed(2)) };
              }
              return { ...a, targetPercent: parseFloat(eq.toFixed(2)) };
            });
          }
          const eqPart = remaining / zeroAssets.length;
          let zi = 0;
          return groupAssets.map(a => {
            if (isZeroAsset(a)) {
              if (zi === zeroAssets.length - 1) {
                const al = (zeroAssets.length - 1) * parseFloat(eqPart.toFixed(2));
                return { ...a, targetPercent: parseFloat((remaining - al).toFixed(2)) };
              }
              zi++;
              return { ...a, targetPercent: parseFloat(eqPart.toFixed(2)) };
            }
            return a;
          });
        }

        return groupAssets;
      }

      /**
       * Распределение целевых процентов между активами.
       * В режиме групп (groups передан и не пуст) распределение выполняется
       * независимо в рамках каждой группы: сумма целей активов группы = 100%.
       * Активы без группы (groupId == null) распределяются как отдельная группа.
       * @param {Array} assets - Массив активов
       * @param {Set<number>} [emptyTargetIds] - Набор id активов с пустым полем "Цель"
       * @param {Array|null} [groups] - Массив групп [{ id, name, percent }]
       * @returns {Array} Новый массив с заполненными targetPercent
       */
      static distributeTargets(assets, emptyTargetIds = new Set(), groups = null) {
        if (assets.length === 0) return assets;

        // Режим групп: распределяем независимо в рамках каждой группы
        if (groups && groups.length > 0) {
          const groupIds = [...new Set(assets.map(a => a.groupId).filter(id => id != null))];
          // Активы без группы — отдельная "группа" (groupId = null)
          const ungrouped = assets.filter(a => a.groupId == null);
          let result = [];
          for (const gid of groupIds) {
            const groupAssets = assets.filter(a => a.groupId === gid);
            result = result.concat(this.distributeGroupTargets(groupAssets, emptyTargetIds));
          }
          if (ungrouped.length > 0) {
            result = result.concat(this.distributeGroupTargets(ungrouped, emptyTargetIds));
          }
          return result;
        }

        return this.distributeGroupTargets(assets, emptyTargetIds);
      }

      /**
       * Полный анализ портфеля с учётом эффективной стоимости и лимита бюджета.
       * В режиме групп (groups передан и не пуст) эффективная стоимость
       * распределяется по группам пропорционально их долям, и targetPercent
       * актива применяется как процент от стоимости его группы.
       * @param {Array} assets - Массив активов
       * @param {number} effectiveTotalValue - Эффективная стоимость портфеля
       * @param {number} [availableBudget] - Доступный бюджет на докупку
       * @param {Array|null} [groups] - Массив групп [{ id, name, percent }]
       * @returns {{ analysis: Array, cashSpent: number }}
       */
      static analyzePortfolio(assets, effectiveTotalValue = 0, availableBudget, groups = null) {
        const currentPercentages = this.calculatePercentages(assets, groups);
        const totalPortfolioValue = this.calculateTotalValue(assets);
        const effectiveValue = effectiveTotalValue > 0 ? effectiveTotalValue : totalPortfolioValue;

        // В режиме групп: для каждого актива определяем эффективную стоимость его группы
        const groupEffectiveValues = {};
        if (groups && groups.length > 0) {
          for (const g of groups) {
            groupEffectiveValues[g.id] = effectiveValue * g.percent / 100;
          }
        }

        const rawAnalysis = assets.map((asset, index) => {
          let targetValue = effectiveValue;
          if (groups && groups.length > 0 && asset.groupId != null) {
            // Эффективная стоимость группы актива
            targetValue = groupEffectiveValues[asset.groupId] ?? effectiveValue;
          }
          return {
            asset,
            currentPercent: currentPercentages[index],
            requiredQuantity: this.calculateRequiredQuantity(asset, asset.targetPercent, targetValue),
          };
        });

        // Выручка от продажи активов (adjustment < 0) — добавляется к бюджету
        // докупки, чтобы деньги от продаж использовались для покупки активов,
        // отстающих от целевой доли.
        const salesTotal = rawAnalysis.reduce((sum, { asset, requiredQuantity }) => {
          const adjustment = this.calculateAdjustment(asset.quantity, requiredQuantity);
          return adjustment < 0 ? sum + Math.abs(adjustment) * asset.price : sum;
        }, 0);

        // Бюджет докупки = доступные деньги + выручка от продаж.
        // cashSpent — нетто-эффект на остаток: покупки минус выручка от продаж.
        let budget = availableBudget != null ? availableBudget + salesTotal : Infinity;
        let cashSpent = 0;

        const analysis = rawAnalysis.map(({ asset, currentPercent, requiredQuantity }) => {
          const adjustment = this.calculateAdjustment(asset.quantity, requiredQuantity);
          let finalAdjustment = adjustment;
          let finalRequiredQuantity = requiredQuantity;

          if (adjustment > 0 && availableBudget != null) {
            const desiredCost = adjustment * asset.price;
            if (desiredCost > budget) {
              const affordableQuantity = this.floorQuantity(budget / asset.price);
              finalAdjustment = affordableQuantity;
              finalRequiredQuantity = asset.quantity + affordableQuantity;
              const spent = this.floorMoney(affordableQuantity * asset.price);
              budget -= spent;
              cashSpent += spent;
            } else {
              const spent = this.floorMoney(desiredCost);
              budget -= spent;
              cashSpent += spent;
            }
          }

          return {
            ...asset,
            currentValue: asset.quantity * asset.price,
            currentPercent,
            requiredQuantity: finalRequiredQuantity,
            adjustment: finalAdjustment,
            adjustmentValue: this.floorMoney(finalAdjustment * asset.price),
            isOverweight: currentPercent > asset.targetPercent,
            isUnderweight: currentPercent < asset.targetPercent,
          };
        });

        // Возвращаем нетто-эффект: потраченные на покупки деньги за вычетом
        // выручки от продаж (если продажи больше покупок — значение отрицательное,
        // остаток на счету увеличивается).
        return { analysis, cashSpent: this.floorMoney(cashSpent - salesTotal) };
      }
    }

    /**
     * Сервис получения цен через ISS API Московской биржи.
     */
    class MoexPriceService {
      static ISS_URL = 'https://iss.moex.com/iss';
      static MARKETS = [
        { engine: 'stock', market: 'shares' },
        { engine: 'stock', market: 'etf' },
        { engine: 'stock', market: 'bonds' },
        { engine: 'stock', market: 'foreignshares' },
        { engine: 'stock', market: 'depositaryreceipts' },
      ];
      static BOARD_PRIORITY = ['TQBR', 'TQTF', 'TQOB', 'TQTD', 'TQPI', 'SMAL', 'CETS'];

      /**
       * Определить, является ли строка ISIN (12 символов: буквы A–Z и цифры).
       * @param {string} value - Входная строка
       * @returns {boolean} true, если строка похожа на ISIN
       */
      static isIsin(value) {
        return /^[A-Z]{2}[A-Z0-9]{9}[0-9]$/.test(value.toUpperCase());
      }

      /**
       * Резолвить ISIN в тикер (secid) через поисковый эндпоинт ISS API.
       * @param {string} isin - ISIN инструмента (например 'RU000A0JX0J2')
       * @returns {Promise<string>} Тикер (secid) инструмента
       * @throws {Error} Если ISIN не найден на Мосбирже
       */
      static async resolveIsin(isin) {
        const isinUpper = isin.toUpperCase();
        const url = `${this.ISS_URL}/securities.json?q=${encodeURIComponent(isinUpper)}&iss.meta=off`;
        const response = await fetch(url, { signal: AbortSignal.timeout(5000) });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const securities = data.securities;
        if (!securities?.data?.length) {
          throw new Error(`ISIN "${isinUpper}" не найден на Мосбирже`);
        }
        const cols = securities.columns;
        const si = cols.indexOf('secid');
        if (si === -1) throw new Error(`ISIN "${isinUpper}" не найден на Мосбирже`);
        return securities.data[0][si];
      }

      static async fetchPrice(value) {
        // Если введён ISIN — сначала резолвим его в тикер
        const ticker = this.isIsin(value) ? await this.resolveIsin(value) : value;
        const tickerUpper = ticker.toUpperCase();
        let lastError = null;
        for (const { engine, market } of this.MARKETS) {
          try {
            const url = `${this.ISS_URL}/engines/${engine}/markets/${market}/securities/${tickerUpper}.json?iss.meta=off`;
            const response = await fetch(url, { signal: AbortSignal.timeout(5000) });
            if (response.status === 404) continue;
            if (!response.ok) { lastError = new Error(`HTTP ${response.status}`); continue; }
            const data = await response.json();
            const marketdata = data.marketdata;
            const securities = data.securities;
            if (!marketdata?.data?.length) continue;
            const cols = marketdata.columns;
            const bi = cols.indexOf('BOARDID');
            const li = cols.indexOf('LAST');
            const mi = cols.indexOf('MARKETPRICE');
            const lci = cols.indexOf('LCLOSEPRICE');
            if (bi === -1 || li === -1) continue;
            for (const b of this.BOARD_PRIORITY) {
              const r = marketdata.data.find(r => r[bi] === b);
              if (!r) continue;
              if (r[li] && parseFloat(r[li]) > 0) return parseFloat(r[li]);
              if (mi !== -1 && r[mi] && parseFloat(r[mi]) > 0) return parseFloat(r[mi]);
              if (lci !== -1 && r[lci] && parseFloat(r[lci]) > 0) return parseFloat(r[lci]);
            }
            for (const r of marketdata.data) {
              if (r[li] && parseFloat(r[li]) > 0) return parseFloat(r[li]);
              if (mi !== -1 && r[mi] && parseFloat(r[mi]) > 0) return parseFloat(r[mi]);
              if (lci !== -1 && r[lci] && parseFloat(r[lci]) > 0) return parseFloat(r[lci]);
            }
            if (securities?.data?.length) {
              const sc = securities.columns;
              const pi = sc.indexOf('PREVPRICE');
              if (pi !== -1) for (const r of securities.data) if (r[pi] && parseFloat(r[pi]) > 0) return parseFloat(r[pi]);
            }
          } catch (err) { lastError = err; }
        }
        throw lastError || new Error(`Актив "${tickerUpper}" не найден на Мосбирже`);
      }

      static async fetchPrices(tickers) {
        const results = await Promise.allSettled(tickers.map(t => this.fetchPrice(t)));
        const prices = results.map(r => r.status === 'fulfilled' ? r.value : null);
        const errors = tickers
          .map((t, i) => results[i].status === 'rejected' ? `${t}: ${results[i].reason.message}` : null)
          .filter(Boolean);
        return { prices, errors };
      }
    }

    class AssetValidator {
      /**
       * Валидация одного актива.
       * @param {Object} asset - Данные актива
       * @param {boolean} [requireGroup] - true — актив обязан иметь groupId
       * @returns {{ isValid: boolean, errors: string[] }}
       */
      static validate(asset, requireGroup = false) {
        const errors = [];
        if (asset.quantity < 0) errors.push('Количество не может быть отрицательным');
        if (asset.price < 0) errors.push('Цена не может быть отрицательной');
        if (asset.targetPercent < 0 || asset.targetPercent > 100) errors.push('Целевой процент должен быть от 0 до 100');
        if (requireGroup && asset.groupId == null) errors.push('Выберите группу для актива');
        return { isValid: errors.length === 0, errors };
      }

      /**
       * Валидация портфеля в целом.
       * Без групп: сумма targetPercent всех активов = 100%.
       * С группами: сумма процентов групп = 100%, каждый актив имеет группу,
       * и сумма targetPercent активов в каждой группе = 100%.
       * @param {Array} assets - Массив активов
       * @param {Array|null} [groups] - Массив групп [{ id, name, percent }]
       * @returns {{ isValid: boolean, error?: string, shouldShow?: boolean }}
       */
      static validatePortfolio(assets, groups = null) {
        const hasAny = assets.some(a => a.targetPercent > 0);
        if (!hasAny) return { isValid: true, shouldShow: false };

        // Режим групп
        if (groups && groups.length > 0) {
          // 1. Каждый актив обязан иметь группу
          const ungrouped = assets.filter(a => a.groupId == null);
          if (ungrouped.length > 0) {
            return { isValid: false, shouldShow: true, error: 'Все активы должны быть привязаны к группе' };
          }

          // 2. Сумма процентов групп = 100%
          const sumGroupPercents = groups.reduce((s, g) => s + g.percent, 0);
          if (Math.abs(sumGroupPercents - 100) > 0.01) {
            return { isValid: false, shouldShow: true, error: `Сумма долей групп должна быть 100%, сейчас ${sumGroupPercents.toFixed(2)}%` };
          }

          // 3. Для каждой группы сумма targetPercent активов = 100%
          for (const g of groups) {
            const groupAssets = assets.filter(a => a.groupId === g.id);
            if (groupAssets.length === 0) continue;
            const sum = groupAssets.reduce((s, a) => s + a.targetPercent, 0);
            if (Math.abs(sum - 100) > 0.01) {
              return { isValid: false, shouldShow: true, error: `Сумма целей активов группы «${g.name}» должна быть 100%, сейчас ${sum.toFixed(2)}%` };
            }
          }
          return { isValid: true, shouldShow: true };
        }

        // Без групп — как раньше
        const sum = assets.reduce((s, a) => s + a.targetPercent, 0);
        if (Math.abs(sum - 100) > 0.01) return { isValid: false, shouldShow: true, error: `Сумма целевых процентов должна быть 100%, сейчас ${sum.toFixed(2)}%` };
        return { isValid: true, shouldShow: true };
      }
    }

    // ============================================================================
    // PERSISTENCE LAYER
    // ============================================================================

    class PortfolioStorage {
      static STORAGE_KEY = 'portfolioRebalancerData';
      static DATA_VERSION = 3;

      static save(data) {
        try {
          const payload = {
            version: this.DATA_VERSION,
            savedAt: new Date().toISOString(),
            assets: data.assets,
            nextId: data.nextId,
            cashBalance: data.cashBalance ?? 0,
            useGroups: data.useGroups ?? false,
            groups: data.groups ?? [],
            nextGroupId: data.nextGroupId ?? 1,
          };
          localStorage.setItem(this.STORAGE_KEY, JSON.stringify(payload));
        } catch (err) {
          console.warn('[PortfolioStorage] Ошибка сохранения:', err.message);
        }
      }

      static load() {
        try {
          const raw = localStorage.getItem(this.STORAGE_KEY);
          if (!raw) return null;
          const data = JSON.parse(raw);
          if (!this.validate(data)) return null;
          return {
            assets: data.assets,
            nextId: data.nextId,
            cashBalance: data.cashBalance ?? 0,
            useGroups: data.useGroups ?? false,
            groups: data.groups ?? [],
            nextGroupId: data.nextGroupId ?? 1,
          };
        } catch { return null; }
      }

      static clear() {
        try { localStorage.removeItem(this.STORAGE_KEY); } catch { /* ignore */ }
      }

      static exportToFile(data) {
        try {
          const payload = {
            version: this.DATA_VERSION,
            exportedAt: new Date().toISOString(),
            assets: data.assets,
            nextId: data.nextId,
            cashBalance: data.cashBalance ?? 0,
            useGroups: data.useGroups ?? false,
            groups: data.groups ?? [],
            nextGroupId: data.nextGroupId ?? 1,
          };
          const json = JSON.stringify(payload, null, 2);
          const blob = new Blob([json], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const date = new Date().toISOString().slice(0, 10);
          const a = document.createElement('a');
          a.href = url; a.download = `portfolio_${date}.json`;
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          URL.revokeObjectURL(url);
        } catch (err) {
          console.error('[PortfolioStorage] Ошибка экспорта:', err.message);
          throw err;
        }
      }

      static async importFromFile(file) {
        const text = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.onerror = () => reject(new Error('Ошибка чтения файла'));
          reader.readAsText(file);
        });
        let data;
        try { data = JSON.parse(text); }
        catch { throw new Error('Файл не является корректным JSON'); }
        if (!this.validate(data)) throw new Error('Неверный формат файла');
        return {
          assets: data.assets,
          nextId: data.nextId,
          cashBalance: data.cashBalance ?? 0,
          useGroups: data.useGroups ?? false,
          groups: data.groups ?? [],
          nextGroupId: data.nextGroupId ?? 1,
        };
      }

      static validate(data) {
        if (!data || typeof data !== 'object') return false;
        if (!Array.isArray(data.assets)) return false;
        const assetsValid = data.assets.every(a =>
          typeof a.id === 'number' &&
          typeof a.ticker === 'string' &&
          typeof a.quantity === 'number' &&
          typeof a.price === 'number' &&
          typeof a.targetPercent === 'number'
        );
        if (!assetsValid) return false;
        // Группы опциональны (для обратной совместимости со старыми файлами)
        if (data.groups != null && !Array.isArray(data.groups)) return false;
        return true;
      }
    }

    /**
     * Интеллектуальное числовое поле ввода.
     */
    function NumericInput({ value, onChange, isInteger = false, onEmptyChange, ...inputProps }) {
      const [rawValue, setRawValue] = useState(value != null ? String(value) : '');
      const onEmptyChangeRef = useRef(onEmptyChange);
      onEmptyChangeRef.current = onEmptyChange;

      useEffect(() => {
        setRawValue(value != null ? String(value) : '');
        if (value != null && value !== 0) {
          if (onEmptyChangeRef.current) onEmptyChangeRef.current(false);
        }
      }, [value]);

      const handleChange = (e) => {
        const v = e.target.value;
        if (isInteger) {
          if (v === '' || /^\d+$/.test(v)) { setRawValue(v); if (onEmptyChange) onEmptyChange(v === ''); }
        } else {
          if (v === '' || /^\d+\.?\d*$/.test(v) || /^\d*\.?\d+$/.test(v)) { setRawValue(v); if (onEmptyChange) onEmptyChange(v === ''); }
        }
      };

      const handleBlur = () => {
        const trimmed = rawValue.trim();
        if (trimmed === '') { onChange(0); setRawValue('0'); return; }
        const parsed = isInteger ? parseInt(trimmed, 10) : parseFloat(trimmed);
        const num = isNaN(parsed) ? 0 : parsed;
        onChange(num);
        setRawValue(String(num));
        if (onEmptyChange) onEmptyChange(false);
      };

      return <input type="text" inputMode={isInteger ? 'numeric' : 'decimal'} value={rawValue} onChange={handleChange} onBlur={handleBlur} {...inputProps} />;
    }

    /**
     * Палитра цветов для выбора при создании группы активов.
     * Пользователь выбирает цвет из этого набора через color picker.
     * @type {string[]} Массив hex-цветов
     */
    const GROUP_COLORS = ['#3b82f6', '#10b981', '#8b5cf6', '#f59e0b', '#f43f5e', '#06b6d4'];

    /**
     * Получить hex-цвет группы по её id.
     * Если группа не найдена или groupId == null — возвращается серый (slate-400).
     * @param {number|null} groupId - ID группы
     * @param {Array} groups - Массив групп [{ id, name, percent, color }]
     * @returns {string} Hex-цвет группы (например '#3b82f6')
     */
    function getGroupColor(groupId, groups) {
      if (groupId == null) return '#94a3b8'; // slate-400
      const group = groups.find(g => g.id === groupId);
      return group?.color || '#94a3b8';
    }

      const getPercentageColor = (current, target) => {

          </td>

    /**
     * Компонент отображения целевых и текущих долей групп в портфеле.
     * Показывается в режиме групп (useGroups && groups.length > 0).
     * @param {Object} props
     * @param {Array} props.groups - Массив групп [{ id, name, percent }]
     * @param {Array} props.assets - Массив активов
     */
    function GroupAllocations({ groups, assets }) {
      // Общая стоимость портфеля
      const totalValue = PortfolioCalculator.calculateTotalValue(assets);

      // Для каждой группы считаем текущую стоимость и долю
      const data = groups.map((g, index) => {
        const groupAssets = assets.filter(a => a.groupId === g.id);
        const groupValue = PortfolioCalculator.calculateTotalValue(groupAssets);
        const currentPercent = totalValue > 0 ? groupValue / totalValue * 100 : 0;
        const targetPercent = g.percent;
        const diff = currentPercent - targetPercent;
        const color = getGroupColor(g.id, groups);
        return { ...g, groupValue, currentPercent, targetPercent, diff, color, index };
      });

      return (
        <div className="bg-white rounded-lg shadow-md border border-slate-200 p-4 mb-6">
          <div className="text-sm font-semibold text-slate-700 mb-3">Доли групп в портфеле</div>
          <div className="space-y-3">
            {data.map(item => {
              // Отклонение группы от целевой доли:
              // - отстаёт (нужно докупить) — зелёным с '+'
              // - опережает (нужно продать) — красным с '-'
              // - баланс (|diff| < 1) — зелёным без знака
              const isUnderweight = item.currentPercent < item.targetPercent;
              const isOverweight = item.currentPercent > item.targetPercent;
              const isBalanced = Math.abs(item.diff) < 1;
              const diffColor = isUnderweight || isBalanced ? 'text-green-600' : isOverweight ? 'text-red-600' : 'text-green-600';
              const diffSign = isUnderweight ? '+' : isOverweight ? '-' : '';
              return (
                <div key={item.id} className="flex items-center gap-3">
                  <span className="inline-block w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ backgroundColor: item.color }} />
                  <span className="inline-block px-2 py-0.5 rounded text-xs font-medium text-white" style={{ backgroundColor: item.color }}>{item.name}</span>
                  <div className="flex-1">
                    <div className="h-2 bg-slate-100 rounded-full overflow-hidden">
                      <div
                        className="h-full rounded-full transition-all"
                        style={{ width: `${Math.min(Math.max(item.currentPercent, 0), 100)}%`, backgroundColor: item.color }}
                      />
                    </div>
                  </div>
                  <div className="text-right flex-shrink-0">
                    <div className="text-sm font-medium text-slate-700">
                      {item.currentPercent.toFixed(2)}% <span className="text-slate-400 text-xs">/ {item.targetPercent.toFixed(2)}%</span>
                    </div>
                    <div className={`text-xs font-medium ${diffColor}`}>
                      {diffSign}{item.diff.toFixed(2)}%
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

              <div>
                <div className="font-medium text-slate-800 setting-title">
                  Использовать группы <span className="text-xs font-semibold text-purple-600 bg-purple-50 px-1.5 py-0.5 rounded">Про</span>
                </div>
                <div className="text-sm text-slate-500">Группировка активов по категориям</div>
              </div>
              <button
                type="button"
                disabled={tier !== 'pro'}
                onClick={() => onUseGroupsChange(!useGroups)}
                className={`relative w-12 h-6 rounded-full transition-colors ${
                  useGroups ? 'bg-blue-600' : 'bg-slate-300'
                } ${tier !== 'pro' ? 'cursor-not-allowed' : 'cursor-pointer'}`}
                aria-label="Использовать группы"
              >
                <span className={`absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-all ${useGroups ? 'left-[26px]' : 'left-0.5'}`} />
              </button>
            </div>

            {/* Блок управления группами — виден только при включённых группах и тарифе Про */}
            {useGroups && tier === 'pro' && (
              <div className="py-4 border-b border-slate-200">
                <div className="font-medium text-slate-800 mb-2">Группы активов</div>
                <div className="text-sm text-slate-500 mb-3">
                  Добавьте названия групп и их долю в портфеле. Сумма долей всех групп должна быть 100%.
                </div>

                {/* Форма добавления группы */}
                <div className="flex flex-wrap gap-2 mb-3">
                  <input
                    type="text"
                    value={newGroupName}
                    onChange={(e) => setNewGroupName(e.target.value)}
                    placeholder="Название группы (например, Акции)"
                    className="flex-1 min-w-[200px] px-3 py-2 border border-slate-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                  <input
                    type="text"
                    inputMode="decimal"
                    value={newGroupPercent}
                    onChange={(e) => {
                      const v = e.target.value;
                      if (v === '' || /^\d+\.?\d*$/.test(v) || /^\d*\.?\d+$/.test(v)) setNewGroupPercent(v);
                    }}
                    placeholder="Доля %"
                    className="w-24 px-3 py-2 border border-slate-300 rounded text-sm text-right focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                  {/* Выбор цвета группы через color picker */}
                  <label className="flex items-center gap-2 px-3 py-2 border border-slate-300 rounded text-sm cursor-pointer hover:border-blue-400 transition-colors" title="Выбрать цвет группы">
                    <input
                      type="color"
                      value={newGroupColor}
                      onChange={(e) => setNewGroupColor(e.target.value)}
                      className="w-8 h-8 border-0 rounded cursor-pointer"
                    />
                    <span className="text-slate-600">Цвет</span>
                  </label>
                  <button
                    type="button"
                    onClick={handleAddGroup}
                    className="px-4 py-2 bg-blue-600 text-white rounded text-sm font-medium hover:bg-blue-700 transition-colors"
                  >
                    ➕ Добавить
                  </button>
                </div>

                {/* Список групп */}
                {groups.length > 0 && (
                  <div className="space-y-2">
                    {groups.map(g => (
                      <div key={g.id} className="flex items-center justify-between bg-slate-50 rounded-lg px-3 py-2 border border-slate-200">
                        <div className="flex items-center gap-3">
                          <span className="inline-block w-3 h-3 rounded-full flex-shrink-0" style={{ backgroundColor: g.color || '#94a3b8' }} />
                          <span className="font-medium text-slate-800">{g.name}</span>
                          <span className="text-sm text-slate-500">{g.percent.toFixed(2)}%</span>
                        </div>
                        <button
                          type="button"
                          onClick={() => onRemoveGroup(g.id)}
                          className="p-1 text-slate-400 hover:text-red-600 transition-colors"
                          title="Удалить группу"
                        >
                          🗑️
                        </button>
                      </div>
                    ))}
                  </div>
                )}

                {/* Индикатор суммы долей групп */}
                <div className={`mt-3 text-sm font-medium ${Math.abs(sumGroupPercents - 100) <= 0.01 ? 'text-emerald-600' : 'text-amber-600'}`}>
                  Сумма долей: {sumGroupPercents.toFixed(2)}% {Math.abs(sumGroupPercents - 100) <= 0.01 ? '✅' : '(должна быть 100%)'}
                </div>
              </div>
            )}

            {/* Процент брокера за покупку активов — заглушка */}
            <div className="flex items-center justify-between py-4 border-b border-slate-200 setting-disabled">
              <div>
                <div className="font-medium text-slate-800 setting-title">Процент брокера за покупку активов</div>
                <div className="text-sm text-slate-500">Комиссия при покупке, %</div>
              </div>
              <input
                type="text"
                inputMode="decimal"
                disabled
                placeholder=""
                className="w-28 px-2 py-1 border border-slate-300 rounded text-sm text-right focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-slate-100 disabled:cursor-not-allowed"
              />
            </div>

            {/* Процент брокера за продажу активов — заглушка */}
            <div className="flex items-center justify-between py-4 border-b border-slate-200 setting-disabled">
              <div>
                <div className="font-medium text-slate-800 setting-title">Процент брокера за продажу активов</div>
                <div className="text-sm text-slate-500">Комиссия при продаже, %</div>
              </div>
              <input
                type="text"
                inputMode="decimal"
                disabled
                placeholder=""
                className="w-28 px-2 py-1 border border-slate-300 rounded text-sm text-right focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-slate-100 disabled:cursor-not-allowed"
              />
            </div>

            <div className="mt-4 p-4 bg-slate-100 rounded-lg text-slate-600 text-sm">
              ⚙️ Настройки брокера пока неактивны и будут реализованы позже.
            </div>
          </div>
        </div>
      );
    }

    /**
     * Главный компонент приложения — Orchestrator.
     */
    function PortfolioRebalancer() {
      // ========================================================================
      // STATE
      // ========================================================================

      const savedData = useMemo(() => PortfolioStorage.load(), []);
      const [assets, setAssets] = useState(() => savedData?.assets || []);

      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [nextId, setNextId] = useState(() => savedData?.nextId ?? 1);

      /** Остаток свободных денежных средств */
      const [cashBalance, setCashBalance] = useState(() => savedData?.cashBalance ?? 0);
      /** Вводимая пользователем добавляемая сумма */
      const [additionalCash, setAdditionalCash] = useState(0);

      // Управление расчётом
      const [isCalculated, setIsCalculated] = useState(false);
      const [isCalculating, setIsCalculating] = useState(false);
      const [animationKey, setAnimationKey] = useState(0);
      /** Результат анализа после нажатия «Рассчитать» (с учётом бюджета) */
      const [calculatedAnalysis, setCalculatedAnalysis] = useState(null);

      const [emptyTargetIds, setEmptyTargetIds] = useState(() => new Set());

      /** Идентификаторы активов, для которых колонка Купить/Продать активна (сброшена после расчёта, обнуляется при изменении количества) */
      const [appliedAdjustmentIds, setAppliedAdjustmentIds] = useState(() => new Set());

      /** Активная страница: 'portfolio' (портфель), 'settings' (настройки) или 'tariffs' (тарифы) */
      const [activePage, setActivePage] = useState('portfolio');

      /** Текущий тариф: 'free' (Бесплатный), 'basic' (Базовый), 'pro' (Про). По умолчанию — Базовый */
      const [tier, setTier] = useState('basic');

      /** Включены ли группы активов (доступно только на тарифе Про) */
      const [useGroups, setUseGroups] = useState(() => savedData?.useGroups ?? false);
      /** Массив групп активов [{ id, name, percent }] */
      const [groups, setGroups] = useState(() => savedData?.groups ?? []);
      /** Счётчик ID групп */
      const [nextGroupId, setNextGroupId] = useState(() => savedData?.nextGroupId ?? 1);

      /** Максимальное количество активов в портфеле в зависимости от тарифа */
      const maxAssets = useMemo(() => {
        return tier === 'free' ? 2 : 100;
      }, [tier]);

      // ========================================================================
      // DERIVED
      // ========================================================================

      const analysis = useMemo(() => {
        return calculatedAnalysis ?? [];
      }, [calculatedAnalysis]);

      const portfolioValidation = useMemo(() => AssetValidator.validatePortfolio(assets, useGroups ? groups : null), [assets, useGroups, groups]);

      // ========================================================================
      // HELPERS
      // ========================================================================

      const resetCalculation = useCallback(() => { setIsCalculated(false); setCalculatedAnalysis(null); }, []);

      // ========================================================================
      // HANDLERS
      // ========================================================================

      const handleUpdateAsset = useCallback((updatedAsset) => {
        const validation = AssetValidator.validate(updatedAsset, useGroups);
        if (!validation.isValid) { setError(validation.errors[0]); return; }
        setAssets(prevAssets => {
          const oldAsset = prevAssets.find(a => a.id === updatedAsset.id);
          const updated = prevAssets.map(a => a.id === updatedAsset.id ? updatedAsset : a);
          if (oldAsset && (oldAsset.ticker !== updatedAsset.ticker || oldAsset.targetPercent !== updatedAsset.targetPercent || oldAsset.groupId !== updatedAsset.groupId)) {
            setTimeout(() => resetCalculation(), 0);
          }
          return updated;
        });
        setError(null);
      }, [resetCalculation, useGroups]);

      const handleAddAsset = useCallback(() => {
        setNextId(prev => prev + 1);
        setAssets(prevAssets => [...prevAssets, { id: nextId, ticker: '', quantity: 0, price: 0, targetPercent: 0, groupId: null }]);
        setError(null);
        resetCalculation();
      }, [nextId, resetCalculation]);

      const handleRemoveAsset = useCallback((id) => {
        if (assets.length <= 1) return;
        setAssets(prevAssets => prevAssets.filter(a => a.id !== id));
        resetCalculation();
      }, [assets.length, resetCalculation]);

      const handleRefreshPrices = useCallback(async () => {
        setLoading(true);
        setError(null);
        try {
          const tickers = assets.map(a => a.ticker).filter(t => t);
          if (tickers.length === 0) { setLoading(false); return; }
          const { prices, errors } = await MoexPriceService.fetchPrices(tickers);
          setAssets(prevAssets => prevAssets.map((asset, index) => ({
            ...asset, price: prices[index] !== null ? prices[index] : asset.price,
          })));
          if (errors.length > 0) setError(`Не удалось загрузить: ${errors.join('; ')}`);
          resetCalculation();
        } catch (err) { setError(`Ошибка получения цен: ${err.message}`); }
        finally { setLoading(false); }
      }, [assets, resetCalculation]);

      /**
       * Прямое редактирование остатка денежных средств.
       * @param {number} value - Новое значение cashBalance (округляется вниз)
       */
      const handleCashBalanceChange = useCallback((value) => {
        setCashBalance(PortfolioCalculator.floorMoney(value));
      }, []);

      /** Добавить денежные средства из поля ввода к cashBalance */
      const handleAddCash = useCallback(() => {
        if (additionalCash > 0) {
          setCashBalance(prev => PortfolioCalculator.floorMoney(prev + additionalCash));
          setAdditionalCash(0);
        }
      }, [additionalCash]);

      const handleCalculate = useCallback(() => {
        setIsCalculating(true);
        const totalPortfolio = PortfolioCalculator.calculateTotalValue(assets);
        const effectiveTotalValue = totalPortfolio + cashBalance + additionalCash;
        const budget = cashBalance + additionalCash;

        setTimeout(() => {
          const { analysis: rawAnalysis, cashSpent } = PortfolioCalculator.analyzePortfolio(assets, effectiveTotalValue, budget, useGroups ? groups : null);
          setCashBalance(prev => {
            const totalAvailable = prev + additionalCash;
            return PortfolioCalculator.floorMoney(totalAvailable - cashSpent);
          });
          setAdditionalCash(0);
          setCalculatedAnalysis(rawAnalysis);
          setAppliedAdjustmentIds(new Set(assets.map(a => a.id)));
          setIsCalculated(true);
          setIsCalculating(false);
          setAnimationKey(prev => prev + 1);
          setTimeout(() => setIsCalculated(false), 2000);
        }, 400);
      }, [assets, cashBalance, additionalCash, useGroups, groups]);

      /**
       * Обработчик пустоты поля "Цель" для конкретного актива.
       */
      const handleTargetEmptyChange = useCallback((id, isEmpty) => {
        setEmptyTargetIds(prev => {
          const next = new Set(prev);
          if (isEmpty) next.add(id); else next.delete(id);
          return next;
        });
      }, []);

      const handleDistributeEvenly = useCallback(() => {
        setAssets(prevAssets => PortfolioCalculator.distributeTargets(prevAssets, emptyTargetIds, useGroups ? groups : null));
      }, [emptyTargetIds, useGroups, groups]);

      /**
       * Удаляет id актива из appliedAdjustmentIds при изменении количества.
       * Деактивирует колонку «Купить/Продать» для этого актива.
       */
      const handleQuantityChanged = useCallback((id) => {
        setAppliedAdjustmentIds(prev => {
          const next = new Set(prev);
          next.delete(id);
          return next;
        });
      }, []);

      /**
       * Переключение режима групп.
       * При выключении групп сбрасываем groupId у всех активов.
       * @param {boolean} value - Новое значение useGroups
       */
      const handleUseGroupsChange = useCallback((value) => {
        setUseGroups(value);
        if (!value) {
          // При выключении групп очищаем groupId у всех активов
          setAssets(prevAssets => prevAssets.map(a => ({ ...a, groupId: null })));
        }
        resetCalculation();
      }, [resetCalculation]);

      /**
       * Добавление новой группы.
       * @param {string} name - Название группы
       * @param {number} percent - Доля группы в портфеле (%)
       * @param {string} [color] - Выбранный hex-цвет группы (например '#3b82f6')
       */
      const handleAddGroup = useCallback((name, percent, color) => {
        setNextGroupId(prev => prev + 1);
        setGroups(prevGroups => [...prevGroups, { id: nextGroupId, name, percent, color: color || '#94a3b8' }]);
        resetCalculation();
      }, [nextGroupId, resetCalculation]);

      /**
       * Применить требуемое количество ко всем активам.
       * Обновляет количество каждого актива до округлённого requiredQuantity.
       * Также деактивирует колонку «Купить/Продать» для всех активов.
       */
      const handleApplyAllAdjustments = useCallback(() => {
        setAssets(prevAssets => prevAssets.map(a => {
          const aAnalysis = calculatedAnalysis?.find(an => an.id === a.id);
          if (!aAnalysis) return a;
          return { ...a, quantity: Math.round(aAnalysis.requiredQuantity) };
        }));
        setAppliedAdjustmentIds(new Set());
        resetCalculation();
      }, [calculatedAnalysis, resetCalculation]);

      /**
       * Удаление группы.
       * Активы удалённой группы получают groupId = null.
       * @param {number} id - ID группы
       */
      const handleRemoveGroup = useCallback((id) => {
        setGroups(prevGroups => prevGroups.filter(g => g.id !== id));
        setAssets(prevAssets => prevAssets.map(a => a.groupId === id ? { ...a, groupId: null } : a));
        resetCalculation();
      }, [resetCalculation]);

      /**
       * Смена тарифа.
       * При переходе на тариф ниже Про выключаем группы.
       * @param {string} newTier - Новый тариф
       */
      const handleTierChange = useCallback((newTier) => {
        setTier(newTier);
        if (newTier !== 'pro' && useGroups) {
          handleUseGroupsChange(false);
        }
      }, [useGroups, handleUseGroupsChange]);

      // ========================================================================
      // PERSISTENCE EFFECTS & HANDLERS
      // ========================================================================

      useEffect(() => {
        PortfolioStorage.save({ assets, nextId, cashBalance, useGroups, groups, nextGroupId });
      }, [assets, nextId, cashBalance, useGroups, groups, nextGroupId]);

      useEffect(() => { handleRefreshPrices(); }, []);

      const fileInputRef = useRef(null);

      const handleExport = useCallback(() => {
        try { PortfolioStorage.exportToFile({ assets, nextId, cashBalance, useGroups, groups, nextGroupId }); }
        catch (err) { setError(err.message); }
      }, [assets, nextId, cashBalance, useGroups, groups, nextGroupId]);

      const handleImport = useCallback(async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const data = await PortfolioStorage.importFromFile(file);
          setAssets(data.assets);
          setNextId(data.nextId);
          if (data.cashBalance != null) setCashBalance(data.cashBalance);
          setUseGroups(data.useGroups ?? false);
          setGroups(data.groups ?? []);
          setNextGroupId(data.nextGroupId ?? 1);
          setAdditionalCash(0);
          setAppliedAdjustmentIds(new Set());
          resetCalculation();
          setError(null);
        } catch (err) { setError(err.message); }
        finally { if (fileInputRef.current) fileInputRef.current.value = ''; }
      }, [resetCalculation]);

      const handleReset = useCallback(() => {
        PortfolioStorage.clear();
        setAssets([]);
        setNextId(1);
        setCashBalance(0);
        setAdditionalCash(0);
        setUseGroups(false);
        setGroups([]);
        setNextGroupId(1);
        setIsCalculated(false);
        setCalculatedAnalysis(null);
        setEmptyTargetIds(new Set());
        setAppliedAdjustmentIds(new Set());
        setError(null);
      }, []);

      // ========================================================================
      // RENDER
      // ========================================================================

      const canCalculate = assets.length > 0 && !isCalculating;

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 via-slate-100 to-slate-50">
          <div className="bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 text-white shadow-lg">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
              <div className="flex items-center gap-3 mb-2">
                <span className="text-3xl">📈</span>
                <h1 className="text-2xl sm:text-3xl font-bold">Ребалансировка портфеля</h1>
              </div>
              <p className="text-slate-400 text-sm sm:text-base">Управление активами Мосбиржи с автоматическим расчетом ребалансировки</p>

              {/* Меню навигации */}
              <nav className="mt-4 flex gap-2">
                <button
                  onClick={() => setActivePage('portfolio')}
                  className={`px-4 py-2 rounded-lg text-sm font-medium transition-colors ${
                    activePage === 'portfolio'
                      ? 'bg-white text-slate-900'
                      : 'text-slate-300 hover:bg-slate-700 hover:text-white'
                  }`}
                >
                  Портфель
                </button>
                <button
                  onClick={() => setActivePage('settings')}
                  className={`px-4 py-2 rounded-lg text-sm font-medium transition-colors ${
                    activePage === 'settings'
                      ? 'bg-white text-slate-900'
                      : 'text-slate-300 hover:bg-slate-700 hover:text-white'
                  }`}
                >
                  Настройки
                </button>
                <button
                  onClick={() => setActivePage('tariffs')}
                  className={`px-4 py-2 rounded-lg text-sm font-medium transition-colors ${
                    activePage === 'tariffs'
                      ? 'bg-white text-slate-900'
                      : 'text-slate-300 hover:bg-slate-700 hover:text-white'
                  }`}
                >
                  Тарифы
                </button>
              </nav>
            </div>
          </div>

          {activePage === 'settings' ? (
            <SettingsPage
              tier={tier}
              onTierChange={handleTierChange}
              useGroups={useGroups}
              onUseGroupsChange={handleUseGroupsChange}
              groups={groups}
              onAddGroup={handleAddGroup}
              onRemoveGroup={handleRemoveGroup}
            />
          ) : activePage === 'tariffs' ? (
            <TariffsPage />
          ) : (
          <div className="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
            <PortfolioSummary
              analysis={analysis}
              cashBalance={cashBalance}
              onCashBalanceChange={handleCashBalanceChange}
              additionalCash={additionalCash}
              onAdditionalCashChange={setAdditionalCash}
              onAddCash={handleAddCash}
            />

            {error && (
              <div className="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg text-red-800 text-sm">⚠️ {error}</div>
            )}

            {useGroups && groups.length > 0 && (
              <GroupAllocations groups={groups} assets={assets} />
            )}

            {assets.length > 0 ? (
              <>
                <div className="bg-white rounded-lg shadow-md border border-slate-200 overflow-x-auto">
                  <table className="w-full min-w-[700px]">
                    <PortfolioHeader
                      useGroups={useGroups}
                      canApplyAll={analysis.length > 0}
                      onApplyAll={handleApplyAllAdjustments}
                    />
                    <tbody key={animationKey}>
                      {assets.map((asset, index) => (
                        <AssetRow
                          key={asset.id}
                          asset={asset}
                          analysis={analysis.find(a => a.id === asset.id)}
                          onUpdate={handleUpdateAsset}
                          onRemove={handleRemoveAsset}
                          onDistributeEvenly={handleDistributeEvenly}
                          onTargetEmptyChange={handleTargetEmptyChange}
                          onQuantityChanged={handleQuantityChanged}
                          isLoading={loading}
                          isLastAsset={assets.length <= 1}
                          animate={isCalculated}
                          animateDelay={index}
                          isAdjustmentActive={appliedAdjustmentIds.has(asset.id)}
                          useGroups={useGroups}
                          groups={groups}
                        />
                      ))}
                    </tbody>
                  </table>
                </div>

                {portfolioValidation.shouldShow && !portfolioValidation.isValid && (
                  <div className="mt-4 p-4 bg-amber-50 border border-amber-200 rounded-lg text-amber-800 text-sm">⚠️ {portfolioValidation.error}</div>
                )}

                {!isCalculated && (
                  <div className="mt-4 p-4 bg-blue-50 border border-blue-200 rounded-lg text-blue-800 text-sm">
                    💡 Нажмите <strong>«Рассчитать»</strong> для выполнения расчёта ребалансировки.
                  </div>
                )}
              </>
            ) : (
              <div className="bg-white rounded-lg shadow-md border border-slate-200 p-8 text-center">
                <div className="text-4xl mb-4">📊</div>
                <h3 className="text-lg font-semibold text-slate-700 mb-2">Портфель пуст</h3>
                <p className="text-slate-500 mb-4">Добавьте активы для расчёта ребалансировки</p>
              </div>
            )}

            <div className="mt-6 flex flex-col sm:flex-row gap-3">
              <button onClick={handleCalculate} disabled={!canCalculate}
                className={`flex items-center justify-center gap-2 px-4 py-2 rounded-lg font-medium transition-all duration-300 w-full sm:w-auto ${
                  isCalculating ? 'bg-blue-500 text-white animate-pulse-glow cursor-wait' :
                  isCalculated ? 'bg-emerald-600 text-white hover:bg-emerald-700 shadow-md shadow-emerald-200' :
                  canCalculate ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-slate-400 text-white cursor-not-allowed'}`}>
                <span className={isCalculating ? 'animate-spin-calc' : ''}>{isCalculating ? '⏳' : isCalculated ? '✅' : '🧮'}</span>
                {isCalculating ? 'Расчёт...' : isCalculated ? 'Рассчитано' : 'Рассчитать'}
              </button>
              <button onClick={handleRefreshPrices} disabled={loading || assets.filter(a => a.ticker).length === 0}
                className="flex items-center justify-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:bg-slate-400 disabled:cursor-not-allowed transition-colors font-medium w-full sm:w-auto">
                🔄 {loading ? 'Загрузка...' : 'Обновить цены'}
              </button>
              <button onClick={handleAddAsset} disabled={assets.length >= maxAssets}
                className="flex items-center justify-center gap-2 px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 disabled:bg-slate-400 disabled:cursor-not-allowed transition-colors font-medium w-full sm:w-auto">
                ➕ Добавить актив ({assets.length}/{maxAssets})
              </button>
            </div>

            <div className="mt-6 flex flex-col sm:flex-row gap-3">
              <button onClick={handleExport} disabled={assets.length === 0}
                className="flex items-center justify-center gap-2 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 disabled:bg-slate-400 disabled:cursor-not-allowed transition-colors font-medium w-full sm:w-auto">💾 Сохранить в файл</button>
              <label className="flex items-center justify-center gap-2 px-4 py-2 bg-amber-600 text-white rounded-lg hover:bg-amber-700 transition-colors font-medium w-full sm:w-auto cursor-pointer">
                📂 Загрузить из файла
                <input type="file" ref={fileInputRef} accept=".json" onChange={handleImport} className="hidden" />
              </label>
              <button onClick={handleReset} disabled={assets.length === 0}
                className="flex items-center justify-center gap-2 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 disabled:bg-slate-400 disabled:cursor-not-allowed transition-colors font-medium w-full sm:w-auto">🗑️ Сбросить всё</button>
            </div>

            <div className="mt-8 p-4 bg-slate-100 rounded-lg text-slate-700 text-sm">
              <p className="font-medium mb-2">💡 Как использовать:</p>
              <ul className="list-disc list-inside space-y-1 text-slate-600">
                <li>Введите тикер актива и нажмите <strong>Обновить цены</strong> для загрузки текущих котировок</li>
                <li>Установите целевой процент для каждого актива (сумма должна быть 100%)</li>
                <li>Добавьте деньги через поле <strong>Деньги</strong> справа, остаток сохраняется между расчётами</li>
                <li>Нажмите <strong>«Рассчитать»</strong> для выполнения расчёта ребалансировки</li>
                <li>Колонка <strong>Купить/Продать</strong> показывает необходимые действия: зелёный «+» — докупить, красный «−» — продать</li>
                <li>Кнопка <strong>«Применить ко всем»</strong> в шапке таблицы обновляет количество всех активов до требуемого</li>
                <li>Колонка <strong>Текущий %</strong>: зелёный — актив отстаёт (докупить), красный — опережает (продать), баланс — зелёный</li>
              </ul>
            </div>
          </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PortfolioRebalancer />);
  </script>
</body>
</html>
